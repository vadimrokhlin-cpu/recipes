<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b4532a">
  <title>מתכונים</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="backBtn" aria-label="חזרה" hidden>→</button>
    <h1 id="title">מתכונים</h1>
    <button id="menuBtn" aria-label="הגדרות">⋮</button>
  </header>
  <main id="view"></main>
  <a id="addBtn" href="#/new" aria-label="מתכון חדש" hidden>+</a>
  <div id="timers" hidden></div>
  <div id="toast" role="status" hidden></div>
  <dialog id="amountDialog">
    <form method="dialog">
      <label id="amountLabel" for="amountInput"></label>
      <input id="amountInput" type="text" inputmode="decimal" autocomplete="off">
      <div class="actions">
        <button class="btn" value="ok">עדכון</button>
        <button class="btn secondary" value="cancel">ביטול</button>
      </div>
    </form>
  </dialog>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
